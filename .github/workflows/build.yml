name: Native builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: windows-2025
            platform: windows-x64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libssl-dev libxkbcommon-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Select Rust
        run: rustup update stable
      - name: Test
        run: cargo +stable test --locked --all-targets
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          scripts/make-macos-app.sh
          app="target/release/Tagcast Lite.app"
          codesign --verify --strict "$app"
          "$app/Contents/MacOS/tagcast-player" --version
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/tagcast-lite-${{ matrix.platform }}.zip"
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo +stable build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./target/release/tagcast-player.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item target/release/tagcast-player.exe,README.md,LICENSE,assets/fonts/Inter-LICENSE.txt -Destination dist/package
          Compress-Archive -Path dist/package/* -DestinationPath "dist/tagcast-lite-${{ matrix.platform }}.zip"
      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo +stable build --locked --release
          target/release/tagcast-player --version
          mkdir -p dist/package
          cp target/release/tagcast-player README.md LICENSE assets/fonts/Inter-LICENSE.txt dist/package/
          tar -czf "dist/tagcast-lite-${{ matrix.platform }}.tar.gz" -C dist/package .
      - uses: actions/upload-artifact@v7
        with:
          name: tagcast-lite-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
