name: Native builds

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to rebuild and publish from main'
        type: string
        required: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag) || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: windows-2025
            platform: windows-x64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG != '' && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}
          persist-credentials: false
      - name: Verify release version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::The release tag must match version $version in Cargo.toml."
            exit 1
          fi
      - name: Check out current signing script for a release retry
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && env.RELEASE_TAG != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/sign-macos-app.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2-dev libdbus-1-dev libssl-dev libxkbcommon-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Select Rust
        run: rustup update stable
      - name: Test
        run: cargo +stable test --locked --all-targets
      - name: Build playback fixture executable
        if: runner.os == 'Linux'
        run: cargo +stable build --locked --release --example playback_checks
      - name: Check playback, seeking, network recovery and gapless
        if: runner.os == 'Linux'
        timeout-minutes: 7
        run: python3 -B tests/playback_fixture.py target/release/examples/playback_checks --skip-device --soak 5 --synthetic-hours 0.02
      - name: Build macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/make-macos-app.sh
      - name: Sign and notarize macOS release
        if: runner.os == 'macOS' && env.RELEASE_TAG != ''
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          script=scripts/sign-macos-app.sh
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            script=".release-tools/$script"
          fi
          bash "$script" "target/release/Tagcast Lite.app"
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="target/release/Tagcast Lite.app"
          codesign --verify --strict "$app"
          "$app/Contents/MacOS/tagcast-player" --version
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/tagcast-lite-${{ matrix.platform }}.zip"
          if [[ -n "$RELEASE_TAG" ]]; then
            check=$(mktemp -d)
            trap 'rm -rf "$check"' EXIT
            ditto -x -k "dist/tagcast-lite-${{ matrix.platform }}.zip" "$check"
            xcrun stapler validate "$check/Tagcast Lite.app"
            codesign --verify --strict "$check/Tagcast Lite.app"
          fi
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo +stable build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./target/release/tagcast-player.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item target/release/tagcast-player.exe,README.md,LICENSE,assets/fonts/Inter-LICENSE.txt -Destination dist/package
          Copy-Item assets/themes/ATTRIBUTION.txt -Destination dist/package/Theme-Attribution.txt
          Compress-Archive -Path dist/package/* -DestinationPath "dist/tagcast-lite-${{ matrix.platform }}.zip"
      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo +stable build --locked --release
          target/release/tagcast-player --version
          mkdir -p dist/package
          cp target/release/tagcast-player README.md LICENSE assets/fonts/Inter-LICENSE.txt dist/package/
          cp assets/themes/ATTRIBUTION.txt dist/package/Theme-Attribution.txt
          tar -czf "dist/tagcast-lite-${{ matrix.platform }}.tar.gz" -C dist/package .
      - uses: actions/upload-artifact@v7
        with:
          name: tagcast-lite-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: tagcast-lite-*
          merge-multiple: true
      - name: Publish release archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          status=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) || status=missing
          if [[ "$status" == false ]]; then
            echo "Release $tag has already been published."
            exit 0
          fi
          mkdir release
          for platform in macos-arm64 macos-x64 windows-x64 linux-x64; do
            extension=zip
            if [[ "$platform" == linux-x64 ]]; then extension=tar.gz; fi
            mv "dist/tagcast-lite-$platform.$extension" "release/tagcast-lite-$version-$platform.$extension"
          done
          cd release
          sha256sum tagcast-lite-* > SHA256SUMS.txt
          if [[ "$status" == missing ]]; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Tagcast Lite $tag" --generate-notes
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber tagcast-lite-* SHA256SUMS.txt
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
